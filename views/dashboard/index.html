<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>柴米油盐 · 家里状态</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#2b2b2b;--muted:#888;--accent:#4a9;--low:#e66;--line:#eee}
[data-theme="dark"]{--bg:#1c1c1e;--card:#2a2a2c;--ink:#eee;--muted:#999;--accent:#5ba;--low:#f77;--line:#3a3a3c}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:22px;font-size:14px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 8px}
.sub{color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{font:inherit;border:0;border-radius:8px;padding:6px 14px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--low)}
input,select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100px}
input.wide{width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line)}
.card.low{border-color:var(--low)}
.card .name{font-weight:600;font-size:15px}
.card .pct{float:right;color:var(--accent);font-variant-numeric:tabular-nums}
.card.low .pct{color:var(--low)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:9px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.card.low .bar i{background:var(--low)}
.meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.edit{display:none;gap:6px;flex-wrap:wrap;margin-top:8px}
.edit.show{display:flex}
.edit label{font-size:12px;color:var(--muted)}
.edit input{width:70px}
pre{background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--line);white-space:pre-wrap;font-size:12px;max-height:230px;overflow:auto}
#msg{color:var(--low);min-height:18px}
</style>
</head>
<body>
<h1>🏠 柴米油盐 · 家里状态</h1>
<div class="sub">库存每天自动消耗；见底时她会主动发起采购过家家。</div>
<div class="row">
 <button onclick="load()">刷新</button>
 <button class="ghost" onclick="toggleAdd()">＋ 新增消耗品</button>
 <button class="ghost" onclick="resetAll()">重置库存为满</button>
 <span id="msg"></span>
</div>
<div id="addbox" class="card" style="display:none">
 <h2>新增消耗品</h2>
 <div class="row">
  <input id="a_name" class="wide" placeholder="名字（如 咖啡豆）">
  <input id="a_max" type="number" value="100" title="满量">
  <input id="a_daily" type="number" step="0.1" value="3" title="每天消耗%">
  <input id="a_var" type="number" step="0.1" value="0.3" title="波动">
  <input id="a_cat" class="wide" placeholder="分类（日用）">
  <input id="a_price" type="number" step="0.1" value="0" title="单价">
  <button onclick="addItem()">添加</button>
 </div>
</div>
<h2>库存 · 点击卡片下方「编辑」可改消耗率等</h2>
<div id="grid" class="grid"></div>
<h2>购物清单 / 场景</h2><pre id="scene"></pre>
<h2>最近家里的事</h2><pre id="events"></pre>
<script>
const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
const api = {
  async get(path, params) {
    if (!bridge) throw new Error('插件面板桥接不可用，请在 AstrBot 控制台里打开');
    const res = await bridge.apiGet(path, params);
    return unwrap(res);
  },
  async post(path, body) {
    if (!bridge) throw new Error('插件面板桥接不可用');
    const res = await bridge.apiPost(path, body);
    return unwrap(res);
  }
};
function unwrap(res){
  if (res && typeof res === 'object' && 'data' in res && 'code' in res) return res.data;
  if (res && typeof res === 'object' && 'ok' in res && !('items' in res)) return res;
  return res;
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items = [], state = {};
async function load(){
  try{
    const [it, st] = await Promise.all([api.get('page/items'), api.get('page/state')]);
    items = it.items || [];
    state = st || {};
    const qty = state.items || {};
    document.getElementById('grid').innerHTML = items.map((x,i)=>{
      const q = Number(qty[x.name] ?? x.max), p = Math.max(0, Math.min(100, Math.round(q/x.max*100)));
      const low = q <= (x.max*0.1);
      const f = (k,v)=>`<label>${k}<input id="e_${i}_${k}" value="${esc(v)}"></label>`;
      return `<div class="card${low?' low':''}">
        <div><span class="name">${esc(x.name)}</span><span class="pct">${p}%</span></div>
        <div class="bar"><i style="width:${p}%"></i></div>
        <div class="meta">${esc(x.category||'其他')} · 剩 ${q.toFixed(1)}/${x.max} · 日耗 ${x.daily}% · ¥${x.price||0}</div>
        <button class="ghost" onclick="toggleEdit(${i})">编辑</button>
        <button class="danger" onclick="del('${esc(x.name)}')">删除</button>
        <div class="edit" id="edit_${i}">
          ${f('满量',x.max)}${f('日耗%',x.daily)}${f('波动',x.var)}
          ${f('分类',x.category||'')}${f('单价',x.price||0)}
          <button onclick="save(${i})">保存</button>
        </div></div>`;
    }).join('') || '<div class="card">还没有消耗品，点上面「新增消耗品」</div>';
    document.getElementById('scene').textContent = '购物清单：' + ((state.scene?.list||[]).map(x=>x.name+'×'+x.qty).join('、')||'（暂无）') + '\n场景：' + (state.scene?.active||'未开始') + ' 第' + ((state.scene?.step||0)+1) + '步';
    document.getElementById('events').textContent = (state.events||[]).map(e=>e.text).join('\n') || '（暂无）';
  }catch(e){ document.getElementById('msg').textContent = '加载失败：'+e.message; }
}
function toggleEdit(i){ document.getElementById('edit_'+i).classList.toggle('show'); }
function val(i,k){ return document.getElementById(`e_${i}_${k}`).value; }
async function save(i){
  const old = items[i].name;
  const item = { name: old, max: +val(i,'满量'), daily: +val(i,'日耗%'), var: +val(i,'波动'),
                 category: val(i,'分类'), price: +val(i,'单价') };
  await send('update', item, old);
}
function toggleAdd(){ const b=document.getElementById('addbox'); b.style.display = b.style.display==='none'?'block':'none'; }
async function addItem(){
  const item = { name: document.getElementById('a_name').value.trim(), max:+document.getElementById('a_max').value,
    daily:+document.getElementById('a_daily').value, var:+document.getElementById('a_var').value,
    category:document.getElementById('a_cat').value.trim(), price:+document.getElementById('a_price').value };
  if(!item.name){ document.getElementById('msg').textContent='名字不能为空'; return; }
  await send('add', item, '');
}
async function del(name){ if(!confirm('删除消耗品「'+name+'」？')) return; await send('delete', {}, name); }
async function send(action,item,old_name){
  try{
    const r = await api.post('page/item', {action, item, old_name});
    if(r && r.ok===false){ document.getElementById('msg').textContent='失败：'+r.error; return; }
    document.getElementById('msg').textContent='已保存';
    toggleAdd(); load();
  }catch(e){ document.getElementById('msg').textContent='失败：'+e.message; }
}
async function resetAll(){
  if(!confirm('把所有库存重置为满？')) return;
  try{ await api.post('page/reset', {}); document.getElementById('msg').textContent='已重置'; load(); }
  catch(e){ document.getElementById('msg').textContent='失败：'+e.message; }
}
(async()=>{ try{ if(bridge && bridge.ready) await bridge.ready(); }catch(e){} await load(); setInterval(load, 30000); })();
</script>
</body>
</html>
